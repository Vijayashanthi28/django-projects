{% extends 'base.html' %}
{% block content %}
<h2>Departments</h2>
<ul>
    {% for dept in departments %}
    <li>
        <b>{{ dept.name }}</b> - {{ dept.location }}
        <ul>
            {% for emp in dept.employees.all %}
            <li>{{ emp.first_name }} {{ emp.last_name }}</li>
            {% endfor %}
        </ul>
    </li>
    {% endfor %}
</ul>
{% endblock %}
